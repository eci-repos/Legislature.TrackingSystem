name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Format, Build, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Legislature.TrackingSystem.sln

      - name: Format (verify no changes)
        run: dotnet format Legislature.TrackingSystem.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Legislature.TrackingSystem.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Legislature.TrackingSystem.sln --configuration Release --no-build

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Validate AWS topology
        working-directory: infra/terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false
          terraform validate

      - name: Validate Entra module
        working-directory: infra/terraform-entra
        run: |
          terraform fmt -check -diff
          terraform init -backend=false
          terraform validate
